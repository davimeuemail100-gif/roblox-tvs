<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Admin Commands</title>
    <style>
        body { background: #111; color: #00ff00; font-family: monospace; padding: 20px; }
        .panel { border: 1px solid #333; padding: 20px; max-width: 400px; background: #1a1a1a;}
        button { background: #d9534f; color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; margin-top: 10px; width: 100%; margin-bottom: 10px; }
        .fly-btn { background: #007bff; }
    </style>
</head>
<body>
    <h1>Painel do Supreme Owner</h1>
    <div class="panel">
        <h3>Jogador: Primo (Moderator)</h3>
        <button onclick="comando('admin:kick')">EXPULSAR (Kick)</button>
        <button class="fly-btn" onclick="comando('admin:fly:on')">LIGAR FLY NO JOGO</button>
        <button class="fly-btn" onclick="comando('admin:fly:off')">DESLIGAR FLY</button>
    </div>

    <script>
        // ⚠️ COLOQUE O LINK DO SEU TÚNEL AQUI ⚠️
        const ws = new WebSocket('wss://bore.pub:15756');

        function comando(cmd) {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(cmd);
                alert(`Comando enviado: ${cmd}`);
            } else {
                alert("Erro: O servidor no Winlator está offline.");
            }
        }
    </script>
</body>
</html>
