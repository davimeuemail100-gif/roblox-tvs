<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCC Cloud Gaming</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: monospace; }
        #game-canvas { width: 100vw; height: 100vh; display: block; }
        
        /* O Console */
        #console-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 180px; background: rgba(0, 0, 0, 0.85); color: #0f0; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s; z-index: 10; }
        #console-container.open { transform: translateY(0); }
        #console-logs { flex: 1; overflow-y: auto; padding: 5px; font-size: 12px; }
        #console-input { width: 100%; background: transparent; border: none; border-top: 1px solid #333; color: white; padding: 10px; outline: none; font-family: monospace; }
        #hud { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px; font-size: 14px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="hud">Status: Conectando...</div>
    <div id="game-canvas"></div>
    
    <div id="console-container">
        <div id="console-logs">Terminal Iniciado. Digite 'help'.</div>
        <input type="text" id="console-input" placeholder="Comando e Enter..." onkeydown="processCommand(event)">
    </div>

    <script>
        // ⚠️ COLOQUE O LINK DO SEU TÚNEL AQUI ⚠️
        const WS_URL = `wss://SEU-TUNEL-PLAYIT.gg`; 
        let ws = new WebSocket(WS_URL);
        
        let isFlying = false;
        let speed = 0.2;

        ws.onopen = () => document.getElementById('hud').innerText = "Conectado!";
        ws.onclose = () => document.getElementById('hud').innerText = "Desconectado do Winlator.";
        ws.onmessage = (event) => {
            if (event.data === "kick") {
                alert("Você foi expulso pelo Administrador.");
                window.location.href = "/log-in";
            }
            log(`[Servidor] ${event.data}`);
        };

        // Motor 3D (Three.js)
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('game-canvas').appendChild(renderer.domElement);

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshLambertMaterial({color: 0x555555}));
        floor.rotation.x = -Math.PI / 2; scene.add(floor);
        
        const player = new THREE.Group();
        const torso = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 1), new THREE.MeshLambertMaterial({color: 0x0D69A9}));
        torso.position.y = 1.5; player.add(torso);
        const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshLambertMaterial({color: 0xF5CD30}));
        head.position.y = 3.1; player.add(head);
        scene.add(player);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8); dirLight.position.set(10, 20, 10); scene.add(dirLight);

        // Controles
        let keys = {};
        document.addEventListener('keydown', (e) => { 
            keys[e.key.toLowerCase()] = true; 
            if(e.key === '`') toggleConsole(); // Tecla ` abre o console
        });
        document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
        
        let camYaw = 0, camPitch = 0.3, isDragging = false;
        document.addEventListener('mousedown', () => isDragging = true);
        document.addEventListener('mouseup', () => isDragging = false);
        document.addEventListener('mousemove', (e) => {
            if (isDragging) { camYaw -= e.movementX * 0.005; camPitch -= e.movementY * 0.005; }
        });

        // Lógica do Terminal
        function toggleConsole() {
            document.getElementById('console-container').classList.toggle('open');
            if (document.getElementById('console-container').classList.contains('open')) {
                document.getElementById('console-input').focus();
            }
        }

        function log(msg) {
            const logs = document.getElementById('console-logs');
            logs.innerHTML += `<br>> ${msg}`;
            logs.scrollTop = logs.scrollHeight;
        }

        function processCommand(event) {
            if (event.key === 'Enter') {
                const cmd = document.getElementById('console-input').value.trim().toLowerCase();
                document.getElementById('console-input').value = '';
                
                if (cmd === 'help') {
                    log("Comandos: fly, unfly, speed [numero]");
                } else if (cmd === 'fly') {
                    isFlying = true; log("Modo Voo ATIVADO.");
                } else if (cmd === 'unfly') {
                    isFlying = false; log("Modo Voo DESATIVADO.");
                } else if (cmd.startsWith('speed ')) {
                    speed = parseFloat(cmd.split(' ')[1]) || 0.2;
                    log(`Velocidade alterada para: ${speed}`);
                } else {
                    log(`Comando '${cmd}' desconhecido.`);
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const forward = new THREE.Vector3(-Math.sin(camYaw), 0, -Math.cos(camYaw));
            const right = new THREE.Vector3(Math.cos(camYaw), 0, -Math.sin(camYaw));

            // Envia comandos para o Winlator
            if (keys['w']) { player.position.add(forward.clone().multiplyScalar(speed)); ws.send("input:W"); }
            if (keys['s']) { player.position.sub(forward.clone().multiplyScalar(speed)); ws.send("input:S"); }
            if (keys['a']) { player.position.sub(right.clone().multiplyScalar(speed)); ws.send("input:A"); }
            if (keys['d']) { player.position.add(right.clone().multiplyScalar(speed)); ws.send("input:D"); }

            if (isFlying) {
                if (keys[' ']) { player.position.y += speed; ws.send("input:SPACE"); }
                if (keys['shift']) { player.position.y -= speed; ws.send("input:SHIFT"); }
            }

            const camX = player.position.x + Math.sin(camYaw) * 15 * Math.cos(camPitch);
            const camZ = player.position.z + Math.cos(camYaw) * 15 * Math.cos(camPitch);
            const camY = player.position.y + 2 + Math.sin(camPitch) * 15;
            
            camera.position.set(camX, camY, camZ);
            camera.lookAt(player.position.x, player.position.y + 2, player.position.z);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
